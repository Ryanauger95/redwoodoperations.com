<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Redwood Operations</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a1a;
      color: #fff;
      text-align: center;
      padding: 2rem;
    }
    .error-content h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 6rem;
      font-weight: 200;
      color: rgba(139, 69, 19, 0.6);
      margin-bottom: 1rem;
    }
    .error-content p {
      font-size: 1.1rem;
      font-weight: 300;
      color: #a0a0a0;
      margin-bottom: 2rem;
    }
    .error-content a {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 1rem 2.5rem;
      background: #8b4513;
      color: #fff;
      text-decoration: none;
      transition: background 0.3s;
    }
    .error-content a:hover { background: #6b3410; }
  </style>
</head>
<body>
  <div class="error-content">
    <h1>404</h1>
    <p>The page you're looking for doesn't exist.</p>
    <a href="/">Return Home</a>
  </div>
</body>
</html>
